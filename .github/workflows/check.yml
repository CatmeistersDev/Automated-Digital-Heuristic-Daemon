name: check

on:
  push:
  pull_request:

jobs:
  ci-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same Python as the Docker image (python:3.11-slim), so CI tests what actually runs.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python deps the tests import (pymupdf for the PDF scenario; schedule + watchdog for scheduler.py)
        run: pip install pymupdf schedule==1.2.2 watchdog==6.0.0

      - name: make check (syntax + compile + shellcheck + frontmatter + behavioral tests)
        run: make check
